name: CI

# Deploys are done by Cloudflare's Git integration (Workers Builds), which runs
# `npm ci && npm run build:cf` then `npx wrangler deploy` on every push to main.
# This workflow only checks the build, so a broken commit is visible on GitHub —
# it does not deploy (that would deploy twice).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Static export to out/. NEXT_PUBLIC_* values are inlined at build time;
      # the AdSense ID is public, the Supabase ones are not needed to prerender.
      - run: npm run build
        env:
          NEXT_PUBLIC_ADSENSE_CLIENT: ca-pub-5438252770961085
